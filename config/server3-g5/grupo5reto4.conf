<VirtualHost *:80>
    ServerName www.grupo5reto4.eus
    ServerAlias grupo5reto4.eus reto.grupo5reto4.eus
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/grupo5reto4_error.log
    CustomLog /var/log/apache2/grupo5reto4_access.log combined
</VirtualHost>
