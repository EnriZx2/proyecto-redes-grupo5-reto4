<VirtualHost *:443>
    ServerName www.grupo5reto4.eus
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/grupo5reto4.crt
    SSLCertificateKeyFile /etc/apache2/ssl/grupo5reto4.key

    ErrorLog /var/log/apache2/grupo5reto4_ssl_error.log
    CustomLog /var/log/apache2/grupo5reto4_ssl_access.log combined
</VirtualHost>
