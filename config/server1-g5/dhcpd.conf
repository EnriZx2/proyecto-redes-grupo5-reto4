failover peer "dhcp-failover" {
    primary;
    address 192.168.5.101;
    port 647;
    peer address 192.168.5.102;
    peer port 647;
    max-response-delay 60;
    max-unacked-updates 10;
    load balance max seconds 3;
    split 128;
    mclt 1800;
}

subnet 192.168.5.0 netmask 255.255.255.0 {
    option routers 192.168.5.1;
    option subnet-mask 255.255.255.0;
    option domain-name-servers 192.168.5.101, 192.168.5.102;
    option domain-name "grupo5.local";

    pool {
        failover peer "dhcp-failover";
        range 192.168.5.150 192.168.5.199;
        allow unknown-clients;
    }
}

host server4-g5 {
    hardware ethernet bc:24:11:47:98:bc;
    fixed-address 192.168.5.104;
}
